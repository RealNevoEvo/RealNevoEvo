    <g fill="none" stroke="url(#aurora)" stroke-width="7.2">
      <path d="M100 18 L38 178 M100 18 L162 178 M62 118 L138 118"/>
      <path d="M100 18 L100 60 M100 78 L100 118" opacity=".55"/>
      <path d="M38 178 L62 178 M138 178 L162 178"/>
      <path d="M52 148 L74 148 M126 148 L148 148" opacity=".5"/>
      <circle cx="100" cy="18" r="3.4"/>
      <circle cx="38" cy="178" r="3.4"/>
      <circle cx="162" cy="178" r="3.4"/>
    </g>
    <circle cx="100" cy="69" r="9" fill="none" stroke="#94FF00" stroke-width="7.2"/>
  </g>

  <rect x="176" y="42" width="1" height="136" fill="url(#trenner)"/>

  <text id="wortmarke" x="212" y="100" fill="#FFFFFF" font-size="48" font-weight="500" letter-spacing="1.6"
