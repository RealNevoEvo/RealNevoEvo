<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220"
     role="img" aria-label="Nevzat Subasioglu, decoding nature to redesign AI">
  <!-- Erzeugt von tools/banner-bauen.ps1. Nicht von Hand aendern, sonst laeuft
       diese Fassung von den anderen fuenf weg. -->
  <defs>
    <radialGradient id="grund" gradientUnits="userSpaceOnUse" cx="513" cy="84" r="630">
      <stop offset="0" stop-color="#1B1235"/><stop offset="1" stop-color="#0A0813"/>
    </radialGradient>
    <radialGradient id="aurora" gradientUnits="userSpaceOnUse" cx="100" cy="69" r="130">
      <stop offset="0" stop-color="#F2F8FF"/><stop offset="0.2" stop-color="#A8D8FF"/><stop offset="0.5" stop-color="#5AA8FF"/><stop offset="0.78" stop-color="#9D7BE8"/><stop offset="1" stop-color="#6E3FA0"/>
    </radialGradient>
    <radialGradient id="hof" gradientUnits="userSpaceOnUse" cx="100" cy="69" r="34">
      <stop offset="0" stop-color="#A8D8FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#A8D8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trenner" gradientUnits="userSpaceOnUse" x1="0" y1="42" x2="0" y2="178">
