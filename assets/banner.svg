      <stop offset="0.5" stop-color="#3B2A6B"/>
      <stop offset="1"   stop-color="#3B2A6B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="schein" gradientUnits="userSpaceOnUse" cx="180" cy="110" r="110">
      <stop offset="0" stop-color="#5AA8FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5AA8FF" stop-opacity="0"/>
