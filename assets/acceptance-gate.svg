<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292"
     role="img" aria-label="acceptance_gate.py , the three-station loop running">
  <defs>
    <clipPath id="box"><rect x="0" y="0" width="760" height="292" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#box)">
    <rect width="760" height="292" fill="#08060F"/>
    <rect width="760" height="292" fill="none" stroke="#3B2A6B" stroke-width="2" rx="10"/>
    <rect width="760" height="34" fill="#120D22"/>
    <line x1="0" y1="34" x2="760" y2="34" stroke="#3B2A6B" stroke-width="1"/>
    <circle cx="20" cy="17" r="4.5" fill="#3B2A6B"/>
    <text x="36" y="22" fill="#A8D8FF" font-size="12"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">acceptance_gate.py</text>
    <text x="176" y="22" fill="#6E6689" font-size="12"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">running</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.03;0.95;1" dur="14s" begin="0.2s" repeatCount="indefinite"/>
        <text x="22" y="66" fill="#6E6689" font-style="italic"># three necessary conditions for acting against your strongest schema</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.03;0.95;1" dur="14s" begin="1.1s" repeatCount="indefinite"/>
        <text x="22" y="92"><tspan fill="#9D7BE8">while</tspan><tspan fill="#7E7595"> alive:</tspan></text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.03;0.95;1" dur="14s" begin="1.9s" repeatCount="indefinite"/>
        <text x="22" y="118"><tspan fill="#EAE6F5">    signal </tspan><tspan fill="#7E7595">= </tspan><tspan fill="#EAE6F5">perceive</tspan><tspan fill="#7E7595">(</tspan><tspan fill="#EAE6F5">reality</tspan><tspan fill="#7E7595">)</tspan></text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.03;0.95;1" dur="14s" begin="2.8s" repeatCount="indefinite"/>
        <text x="22" y="144"><tspan fill="#EAE6F5">    </tspan><tspan fill="#9D7BE8">if</tspan><tspan fill="#A8D8FF"> detection</tspan><tspan fill="#7E7595">(</tspan><tspan fill="#EAE6F5">W₃</tspan><tspan fill="#7E7595">=</tspan><tspan fill="#5AA8FF">0.93</tspan><tspan fill="#7E7595">):</tspan><tspan fill="#6E6689" font-style="italic">   # station 1: you have to look</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.03;0.95;1" dur="14s" begin="3.9s" repeatCount="indefinite"/>
        <rect x="8" y="152" width="744" height="24" fill="#94FF00" fill-opacity="0.09"/>
        <rect x="8" y="152" width="3" height="24" fill="#94FF00"/>
        <text x="22" y="169"><tspan fill="#EAE6F5">        </tspan><tspan fill="#9D7BE8">if</tspan><tspan fill="#A8D8FF"> acceptance</tspan><tspan fill="#7E7595">(</tspan><tspan fill="#EAE6F5">g</tspan><tspan fill="#7E7595">=</tspan><tspan fill="#5AA8FF">0.20</tspan><tspan fill="#7E7595">, </tspan><tspan fill="#EAE6F5">τ</tspan><tspan fill="#7E7595">=</tspan><tspan fill="#5AA8FF">0.90</tspan><tspan fill="#7E7595">):</tspan><tspan fill="#6E6689" font-style="italic">  # station 2: where it binds</tspan></text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.03;0.95;1" dur="14s" begin="5.0s" repeatCount="indefinite"/>
        <text x="22" y="195"><tspan fill="#EAE6F5">            </tspan><tspan fill="#9D7BE8">return</tspan><tspan fill="#A8D8FF"> override</tspan><tspan fill="#7E7595">()</tspan><tspan fill="#6E6689" font-style="italic">     # station 3: you run the loop</tspan></text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.03;0.95;1" dur="14s" begin="6.0s" repeatCount="indefinite"/>
        <text x="22" y="221"><tspan fill="#EAE6F5">    schema</tspan><tspan fill="#7E7595">.</tspan><tspan fill="#EAE6F5">repeat</tspan><tspan fill="#7E7595">()</tspan><tspan fill="#6E6689" font-style="italic">                  # ...or the loop runs you</tspan></text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.03;0.95;1" dur="14s" begin="7.3s" repeatCount="indefinite"/>
        <text x="22" y="253"><tspan fill="#7E7595">&gt;&gt;&gt; </tspan><tspan fill="#94FF00">A = W₃ · σ(Z′ − S₁) · σ(g − τ) · σ(P²/4c − S₂ − r·Δt)</tspan></text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.03;0.95;1" dur="14s" begin="8.4s" repeatCount="indefinite"/>
        <text x="22" y="276"><tspan fill="#7E7595">&gt;&gt;&gt; </tspan><tspan fill="#6E6689" font-style="italic">autonomy is not scale. it is structure.</tspan></text>
        <rect x="360" y="265" width="7" height="14" fill="#94FF00">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
